name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build agbcc
        run: |
          sudo apt-get install -y bison flex
          chmod -R +x tools/agbcc
          cd tools/agbcc
          # Build the compiler engine
          # We remove -Wno-error temporarily to see if there are actual build failures
          make -C gcc
          
          # Verify if cc1 was actually created
          ls -l gcc/cc1
          
          # If it exists, proceed with setup
          mkdir -p bin include
          cp gcc/agbcc bin/agbcc
          cp gcc/cc1 bin/cc1
          
          # Force header placement
          cp -r ginclude/* include/
          mkdir -p gcc/include
          cp -r ginclude/* gcc/include/
          cd ../..
      - name: Build Tools
        run: |
          make tools

      - name: Build ROM
        run: |
          # Set paths to point to the local build
          export AGBCCPATH=$PWD/tools/agbcc
          export COMPILER_PATH=$PWD/tools/agbcc/bin
          export GCC_EXEC_PREFIX=$PWD/tools/agbcc/
          export C_INCLUDE_PATH=$PWD/tools/agbcc/include
          
          # Build the ROM
          make
          
      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
