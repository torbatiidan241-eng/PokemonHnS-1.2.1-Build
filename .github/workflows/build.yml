name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi bison flex

      - name: Build agbcc
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc
          # Build the compiler engine while suppressing modern C-standard errors
          make CFLAGS="-O2 -Wno-error -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration" -C gcc
          
          # Final verification that the binary was created
          ls -l gcc/cc1
          
          # Prepare directory structure
          mkdir -p bin include
          cp gcc/agbcc bin/agbcc
          cp gcc/cc1 bin/cc1
          
          # Force header placement in both the tool root and the gcc engine directory
          cp -r ginclude/* include/
          mkdir -p gcc/include
          cp -r ginclude/* gcc/include/
          cd ../..

      - name: Build Tools
        run: |
          make tools

      - name: Build ROM
        run: |
          # Define environment variables so the compiler finds its dependencies
          export AGBCCPATH=$PWD/tools/agbcc
          export COMPILER_PATH=$PWD/tools/agbcc/bin
          export GCC_EXEC_PREFIX=$PWD/tools/agbcc/
          export C_INCLUDE_PATH=$PWD/tools/agbcc/include
          
          # Start the build
          make
          
      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
