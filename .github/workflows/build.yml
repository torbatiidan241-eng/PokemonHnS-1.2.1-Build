name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify and Build Tools
        run: |
          # 1. Force the submodule into existence
          git submodule update --init --recursive --force
          
          # 2. Check if the tool exists
          if [ ! -f "tools/agbcc/build.sh" ]; then
            echo "ERROR: tools/agbcc submodule is empty! Please check your repository structure."
            exit 1
          fi
          
          # 3. Build the tools
          make tools
          
      - name: Build ROM
        run: |
          make

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
