name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev build-essential

      - name: Build tools
        run: |
          # Build agbcc
          cd tools/agbcc
          ./build.sh
          cd ../..
          # Build other necessary tools
          make tools

      - name: Build ROM
        run: make

      - name: Upload ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rom-build
          path: |
            *.gba
            build/
