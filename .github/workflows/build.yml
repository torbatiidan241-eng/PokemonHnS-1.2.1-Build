name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build agbcc
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc
          # Build compiler
          make CFLAGS="-O2 -Wno-error" -C gcc
          
          # Create and populate include directory
          mkdir -p bin include
          cp gcc/agbcc bin/agbcc
          cp -r ginclude/* include/
          cd ../..

      - name: Build Tools
        run: |
          make tools

      - name: Build ROM
        run: |
          # Use absolute paths for all compiler-related environment variables
          export AGBCCPATH=$PWD/tools/agbcc
          export COMPILER_PATH=$PWD/tools/agbcc/gcc
          export GCC_EXEC_PREFIX=$PWD/tools/agbcc/
          
          # Run make with forced include path via environment variable
          # This is the most compatible way to pass include paths to agbcc
          export C_INCLUDE_PATH=$PWD/tools/agbcc/include
          
          make
          
      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
