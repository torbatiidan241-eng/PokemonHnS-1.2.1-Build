name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build agbcc
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc
          # Build the compiler
          make CFLAGS="-O2 -Wno-error" -C gcc
          
          # Ensure bin exists and move binary
          mkdir -p bin
          cp gcc/agbcc bin/agbcc
          
          # Fix headers: ensure the compiler can find its internal headers
          mkdir -p include
          cp -r ginclude/* include/
          cd ../..

      - name: Build Tools
        run: |
          make tools

      - name: Build ROM
        run: |
          # 1. AGBCCPATH: Defines the base directory for the wrapper
          # 2. COMPILER_PATH: Must point to the directory containing 'cc1'
          export AGBCCPATH=$PWD/tools/agbcc
          export COMPILER_PATH=$PWD/tools/agbcc/gcc
          
          # Use 'make' to trigger the build
          make
          
      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
