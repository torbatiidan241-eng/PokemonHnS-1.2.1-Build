name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build Compiler Tools
        run: |
          # This compiles the agbcc compiler itself from the submodules
          cd tools/agbcc
          ./build.sh
          cd ../..
          
          # This builds other necessary utilities like gbagfx and ramscrgen
          make tools

      - name: Build ROM
        run: |
          # Final build command
          make

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
