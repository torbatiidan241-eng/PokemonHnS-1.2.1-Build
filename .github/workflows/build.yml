name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build agbcc
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc
          # Build compiler engine
          make CFLAGS="-O2 -Wno-error" -C gcc
          
          # Prepare directory structure
          mkdir -p bin include
          cp gcc/agbcc bin/agbcc
          
          # Force header placement in both the tool root and the gcc engine directory
          # This satisfies hardcoded paths in legacy compilers
          cp -r ginclude/* include/
          mkdir -p gcc/include
          cp -r ginclude/* gcc/include/
          cd ../..

      - name: Build Tools
        run: |
          make tools

      - name: Build ROM
        run: |
          # Exporting all paths required by the agbcc wrapper and the makefile
          export AGBCCPATH=$PWD/tools/agbcc
          export COMPILER_PATH=$PWD/tools/agbcc/gcc
          export GCC_EXEC_PREFIX=$PWD/tools/agbcc/
          export C_INCLUDE_PATH=$PWD/tools/agbcc/include
          
          # Start the build
          make
          
      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
