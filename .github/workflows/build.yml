name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build agbcc
        run: |
          # Recursively apply execute permissions to all files in tools/agbcc
          chmod -R +x tools/agbcc
          cd tools/agbcc
          ./build.sh
          cd ../..

      - name: Build Tools
        run: |
          # Build the remaining project-specific tools (gbagfx, etc.)
          make tools

      - name: Build ROM
        run: |
          # Build the game ROM
          make

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
