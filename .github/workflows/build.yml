name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build agbcc
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc
          # Build the compiler
          make CFLAGS="-O2 -Wno-error" -C gcc
          
          # Ensure 'bin' exists and copy the binary
          mkdir -p bin
          cp gcc/agbcc bin/agbcc
          
          # IMPORTANT: Verify headers exist. 
          # If the folder 'include' is missing or empty, the compiler will fail.
          # We copy ginclude files to include to ensure the compiler has its standard headers.
          mkdir -p include
          cp -r ginclude/* include/
          cd ../..

      - name: Build Tools
        run: |
          make tools

      - name: Build ROM
        run: |
          # 1. Set AGBCCPATH: This is the root directory for agbcc.
          # 2. Set GCC_EXEC_PREFIX: This forces the compiler to look in the right place for internal tools.
          export AGBCCPATH=$PWD/tools/agbcc
          export GCC_EXEC_PREFIX=$PWD/tools/agbcc/
          
          # Build the ROM
          make
          
      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
