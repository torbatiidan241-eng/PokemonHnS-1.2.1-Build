name: Build GBA ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build agbcc
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc/gcc
          make CFLAGS="-O2 -Wno-error -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
          cd ../../..
          
          # Prepare bin and include directories
          mkdir -p tools/agbcc/bin tools/agbcc/include
          
          # Copy binaries
          if [ -f "tools/agbcc/gcc/cc1" ]; then cp tools/agbcc/gcc/cc1 tools/agbcc/bin/cc1; fi
          if [ -f "tools/agbcc/gcc/agbcc" ]; then cp tools/agbcc/gcc/agbcc tools/agbcc/bin/agbcc; fi
          
          # Ensure headers are in the expected tools/agbcc/include directory
          cp -r tools/agbcc/ginclude/* tools/agbcc/include/

      - name: Build ROM
        run: |
          # Set paths so agbcc finds its own binaries and headers
          export AGBCCPATH=$PWD/tools/agbcc
          export COMPILER_PATH=$PWD/tools/agbcc/bin
          export C_INCLUDE_PATH=$PWD/tools/agbcc/include
          export PATH=$PWD/tools/agbcc/bin:$PATH
          
          # Run the build
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: rom-build
          path: |
            *.gba
            *.map
