name: Build GBA ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build agbcc
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc
          
          # 1. Explicitly build both components to ensure cc1 is created
          # We use the flags to bypass modern compiler strictness which causes legacy builds to exit early
          make CFLAGS="-O2 -Wno-error -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration" -C gcc cc1 agbcc
          
          # 2. Debugging: List the directory so we can confirm the binary exists
          echo "Verifying binaries in tools/agbcc/gcc/:"
          ls -F gcc/
          
          # 3. Create expected paths
          mkdir -p bin include
          
          # 4. Copy files (only if they exist to prevent build errors)
          if [ -f "gcc/agbcc" ]; then cp gcc/agbcc bin/agbcc; fi
          if [ -f "gcc/cc1" ]; then cp gcc/cc1 bin/cc1; fi
          
          # 5. Populate headers
          cp -r ginclude/* include/
          mkdir -p gcc/include
          cp -r ginclude/* gcc/include/
          cd ../..

      - name: Build ROM
        run: |
          # Ensure tools/agbcc/bin is in the PATH so the main makefile finds it
          export PATH=$PWD/tools/agbcc/bin:$PATH
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: rom-build
          path: |
            *.gba
            *.map
