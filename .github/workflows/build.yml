name: Build GBA ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build agbcc
        run: |
          chmod -R +x tools/agbcc
          # Navigate directly into the gcc subdirectory where the Makefile resides
          cd tools/agbcc/gcc
          
          # Build using the 'all' target with suppression flags for modern compiler warnings
          make CFLAGS="-O2 -Wno-error -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
          
          # Return to root to prepare bin/include directories
          cd ../../..
          mkdir -p tools/agbcc/bin tools/agbcc/include
          
          # Copy the generated binaries to the tools bin directory
          if [ -f "tools/agbcc/gcc/cc1" ]; then cp tools/agbcc/gcc/cc1 tools/agbcc/bin/cc1; fi
          if [ -f "tools/agbcc/gcc/agbcc" ]; then cp tools/agbcc/gcc/agbcc tools/agbcc/bin/agbcc; fi
          
          # Force header placement
          cp -r tools/agbcc/ginclude/* tools/agbcc/include/
          mkdir -p tools/agbcc/gcc/include
          cp -r tools/agbcc/ginclude/* tools/agbcc/gcc/include/

      - name: Build ROM
        run: |
          # Ensure tools/agbcc/bin is in the PATH so the main makefile finds the binaries
          export PATH=$PWD/tools/agbcc/bin:$PATH
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: rom-build
          path: |
            *.gba
            *.map
