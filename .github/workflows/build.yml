name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build agbcc
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc
          # Build the compiler
          make CFLAGS="-O2 -Wno-error" -C gcc
          
          # Ensure bin exists and move binary
          mkdir -p bin
          cp gcc/agbcc bin/agbcc
          cd ../..

      - name: Build Tools
        run: |
          make tools

      - name: Build ROM
        run: |
          # Set the compiler path so it can find its own internal 'include' folder
          # The compiler looks for 'include' relative to AGBCCPATH
          export AGBCCPATH=$PWD/tools/agbcc
          
          # Build the ROM
          make
          
      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
