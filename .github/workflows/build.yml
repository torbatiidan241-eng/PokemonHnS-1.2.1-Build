name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build agbcc
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc
          # Build compiler with ignore-errors flag
          make CFLAGS="-O2 -Wno-error" -C gcc
          
          # Ensure bin exists and move binary
          mkdir -p bin
          cp gcc/agbcc bin/agbcc
          
          # Fix the header path for the compiler
          # This ensures it finds string.h and other ginclude files
          cp -r ginclude/* include/
          cd ../..

      - name: Build Tools
        run: |
          make tools

      - name: Build ROM
        run: |
          # Set the environment variable for the compiler path
          export AGBCCPATH=$PWD/tools/agbcc
          
          # Build the ROM, passing the include path for string.h resolution
          # We use -I to explicitly point the compiler to the agbcc headers
          make CFLAGS="-I$PWD/tools/agbcc/include"
          
      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
