name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build agbcc
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc
          ./build.sh
          # Verify the binary exists after build
          if [ ! -f "bin/agbcc" ]; then
            echo "ERROR: agbcc binary was not created!"
            exit 1
          fi
          cd ../..

      - name: Build Tools
        run: |
          make tools

      - name: Build ROM
        run: |
          make

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
