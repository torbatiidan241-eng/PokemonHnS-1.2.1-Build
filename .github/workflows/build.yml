name: Build GBA ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build and Prepare Tools
        run: |
          # 1. Compile project utilities (gbafix, scaninc, ramscrgen)
          make -j1 tools
          
          # 2. Compile the agbcc engine
          chmod -R +x tools/agbcc
          cd tools/agbcc/gcc
          make -j1 CFLAGS="-O2 -Wno-error -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
          cd ../../..
          
          # 3. Create the directory structure exactly as the compiler expects
          mkdir -p tools/agbcc/bin tools/agbcc/include
          cp tools/agbcc/gcc/cc1 tools/agbcc/bin/cc1
          cp tools/agbcc/gcc/agbcc tools/agbcc/bin/agbcc
          
          # 4. Critical: Populate the internal include folder
          # agbcc looks for headers inside 'include' at the same level as its 'bin' folder
          cp -r tools/agbcc/ginclude/* tools/agbcc/include/

      - name: Build ROM
        run: |
          # Set the compiler path and force the include directory
          # The -I flag ensures the compiler finds the headers
          export AGBCCPATH=$PWD/tools/agbcc
          export PATH=$PWD/tools/agbcc/bin:$PATH
          
          # Execute the build with the include path explicitly defined
          make -j1 "CFLAGS=-I$PWD/tools/agbcc/include"
          
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: rom-build
          path: |
            *.gba
            *.map
