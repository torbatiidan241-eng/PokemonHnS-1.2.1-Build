name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build agbcc
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc
          # Some versions of agbcc require this specific build order
          ./build.sh
          # If ./build.sh didn't create the binary, compile the source directly
          if [ ! -f "bin/agbcc" ]; then
            cd gcc
            make
            cd ..
          fi
          # Final verification
          if [ ! -f "bin/agbcc" ]; then
            echo "ERROR: Still could not create agbcc binary"
            exit 1
          fi
          cd ../..

      - name: Build Tools
        run: |
          make tools

      - name: Build ROM
        run: |
          make

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
