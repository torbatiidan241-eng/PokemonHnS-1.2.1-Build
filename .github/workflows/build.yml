name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build agbcc
        run: |
          # Navigate into your manually added agbcc folder
          cd tools/agbcc
          # Build the compiler
          ./build.sh
          # Return to root
          cd ../..

      - name: Build Tools
        run: |
          # Build other project tools like gbagfx and ramscrgen
          make tools

      - name: Build ROM
        run: |
          make

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hns-rom
          path: '*.gba'
