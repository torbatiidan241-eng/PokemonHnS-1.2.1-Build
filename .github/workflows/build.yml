name: Build GBA ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build agbcc
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc/gcc
          # Using -j1 here ensures the toolchain itself builds reliably
          make -j1 CFLAGS="-O2 -Wno-error -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
          cd ../../..
          
          mkdir -p tools/agbcc/bin tools/agbcc/include
          if [ -f "tools/agbcc/gcc/cc1" ]; then cp tools/agbcc/gcc/cc1 tools/agbcc/bin/cc1; fi
          if [ -f "tools/agbcc/gcc/agbcc" ]; then cp tools/agbcc/gcc/agbcc tools/agbcc/bin/agbcc; fi
          cp -r tools/agbcc/ginclude/* tools/agbcc/include/

      - name: Build ROM
        run: |
          export AGBCCPATH=$PWD/tools/agbcc
          export COMPILER_PATH=$PWD/tools/agbcc/bin
          export C_INCLUDE_PATH=$PWD/tools/agbcc/include
          export PATH=$PWD/tools/agbcc/bin:$PATH
          
          # CRITICAL: Build with -j1 to prevent 'Broken pipe' errors
          # Legacy tools often cannot handle parallel compilation requests
          make -j1
          
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: rom-build
          path: |
            *.gba
            *.map
